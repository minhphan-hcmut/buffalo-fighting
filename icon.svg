<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Chọi trâu: water buffalo head with broad crescent horns on festival red. -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#30281F"/>
  <circle cx="64" cy="64" r="46" fill="#8E2B22"/>
  <!-- broad crescent horns sweeping out and back up -->
  <path d="M52 50 C26 54 12 40 16 20 C22 34 34 40 52 38 Z" fill="#E9DCC0"/>
  <path d="M76 50 C102 54 116 40 112 20 C106 34 94 40 76 38 Z" fill="#E9DCC0"/>
  <!-- head -->
  <path d="M46 42 Q64 34 82 42 L80 68 Q76 92 64 96 Q52 92 48 68 Z" fill="#2A2420"/>
  <path d="M47 50 L33 57 L47 59 Z" fill="#2A2420"/>
  <path d="M81 50 L95 57 L81 59 Z" fill="#2A2420"/>
  <!-- muzzle -->
  <ellipse cx="64" cy="86" rx="12" ry="8.5" fill="#4A3F38"/>
  <circle cx="58.5" cy="86" r="2.2" fill="#1A1512"/>
  <circle cx="69.5" cy="86" r="2.2" fill="#1A1512"/>
  <!-- calm eyes with a small warm highlight -->
  <circle cx="55" cy="62" r="2.6" fill="#120E0C"/>
  <circle cx="73" cy="62" r="2.6" fill="#120E0C"/>
  <circle cx="55.8" cy="61.2" r="0.9" fill="#E8BC65"/>
  <circle cx="73.8" cy="61.2" r="0.9" fill="#E8BC65"/>
</svg>
